baseURL: "https://www.lyteword.com/"
languageCode: en-us
title: "LyteWord"

ignoreFiles:
  - '(?i)README\.md$'
  - '(?i)LICENSE$'

module:
  imports:
    - path: github.com/imfing/hextra

menu:
  main:
    - name: GitHub
      weight: 1
      url: "https://github.com/lyteword"
      params:
        icon: github
        rel: nofollow
  sidebar:
    - name: Gospel
      url: "/the-gospel"
      weight: 1
    - name: Bible
      url: "/bible"
      weight: 2
    - name: Commentaries
      url: "/commentaries"
      weight: 3

disableKinds:
  - taxonomy
  - term

params:
  meta:
    description: "Our mission is to curate and remaster a free, open-source collection of Bible texts, commentaries, sermons, and Christian writings."

  page:
    width: normal

  navbar:
    displayTitle: false
    displayLogo: true
    logo:
      path: images/logo.svg
      link: /
      width: 51

  theme:
    default: system
    displayToggle: true

  blog:
    list:
      displayTags: false
    toc:
      displayTags: false

  footer:
    enable: true
    displayCopyright: true
    displayPoweredBy: false
    width: normal

  search:
    enable: false


enableRobotsTXT: true

